server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Reverse-proxy API calls (baked as relative /api/... in the SPA).
  # Without this, POST/PUT/DELETE to /api hit try_files and return 405.
  location /api/ {
    proxy_pass https://apb.services.pro/api/;
    proxy_http_version 1.1;

    proxy_ssl_server_name on;
    proxy_ssl_verify off;

    proxy_set_header Host apb.services.pro;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /msp/ {
    try_files $uri $uri/ /msp/index.html;
  }

  location = /msp {
    return 301 /msp/;
  }

  location / {
    return 301 /msp$request_uri;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root html;
  }
}
